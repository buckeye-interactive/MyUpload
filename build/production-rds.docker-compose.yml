services:
  web:
    image: ${WEB_IMAGE_NAME}
    env_file:
      - web.vars
    ports:
      - ${EXPOSE_PORT}:80
    volumes:
      - app_storage:/app/storage
    environment:
      PHP_UPLOAD_MAX_FILESIZE: 200m
      PHP_POST_MAX_SIZE: 200m
      SERVICE_NGINX_CLIENT_MAX_BODY_SIZE: 200m

    restart: unless-stopped

  memcached:
    image: memcached:latest
    restart: unless-stopped

volumes:
  app_storage:
